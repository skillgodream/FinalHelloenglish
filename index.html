<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HELLO ENGLISH</title>
    <meta name="description" content="Mobile-first AI English-speaking coach with Coach Neha for Indian entry-level and frontline learners." />
    <meta property="og:title" content="HELLO ENGLISH" />
    <meta property="og:description" content="Mobile-first AI English-speaking coach with Coach Neha for Indian entry-level and frontline learners." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <script>
      // Global Fail-Safe Error Handler for Zero-Blank-Screen Guarantee
      window.__HE_APP_MOUNTED = false;
      function showFailSafeRecoveryUI(msg) {
        var root = document.getElementById('root');
        if (!root || window.__HE_APP_MOUNTED) return;
        root.innerHTML = `
          <div style="min-height:100vh;background:#090d16;color:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:'Plus Jakarta Sans',sans-serif;text-align:center;">
            <div style="width:64px;height:64px;border-radius:24px;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.4);display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
              <span style="font-size:28px;">⚡</span>
            </div>
            <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.5px;margin:0 0 8px 0;color:#ffffff;">HELLO ENGLISH</h1>
            <p style="font-size:13px;color:#94a3b8;max-width:320px;margin:0 0 24px 0;line-height:1.5;">
              App launch recovery active. Tap below to clear cached temporary state and start fresh smoothly.
            </p>
            <button id="he-fail-safe-reload-btn" style="width:100%;max-width:280px;padding:14px 20px;border-radius:16px;background:#38bdf8;color:#030712;font-weight:800;font-size:14px;border:none;cursor:pointer;box-shadow:0 10px 25px rgba(56,189,248,0.25);">
              Reset & Launch App (रीसेट और शुरू करें)
            </button>
          </div>
        `;
        var btn = document.getElementById('he-fail-safe-reload-btn');
        if (btn) {
          btn.onclick = function() {
            try {
              localStorage.clear();
              sessionStorage.clear();
            } catch(e) {}
            window.location.reload();
          };
        }
      }

      window.addEventListener('error', function(e) {
        // Ignore non-fatal DOM resource load errors (e.g. audio elements or images)
        if (e && e.target && (e.target.tagName === 'AUDIO' || e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO')) {
          return;
        }
        var msg = (e && e.message) ? e.message : (e ? String(e) : 'Application error');
        console.warn('[HELLO ENGLISH RECOVERABLE ERROR]', msg);
        if (!window.__HE_APP_MOUNTED) {
          showFailSafeRecoveryUI(msg);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        try {
          if (e) {
            if (typeof e.preventDefault === 'function') {
              e.preventDefault();
            }
            var reason = e.reason || (e.detail && e.detail.reason);
            var reasonStr = reason ? (reason.message || String(reason)) : '';
            // Browser autoplay prevention or audio interruption in iframe preview environments are non-fatal
            var isBenign = /NotAllowedError|AbortError|play\(\)|interrupted|user gesture|autoplay/i.test(reasonStr);
            if (isBenign) {
              console.warn('[HELLO ENGLISH BENIGN AUDIO REJECTION PREVENTED]', reasonStr);
              return;
            }
            console.warn('[HELLO ENGLISH HANDLED REJECTION]', reasonStr || 'Unhandled promise rejection');
          }
        } catch (_) {}
      });
    </script>
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-purple-500/30 selection:text-purple-200">
    <div id="root">
      <!-- Lightweight fail-safe fallback while bundles initialize -->
      <div style="min-height:100vh;background:#090d16;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;font-family:sans-serif;">
        <div style="width:36px;height:36px;border:3px solid #1e293b;border-top-color:#38bdf8;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <p style="margin-top:16px;font-size:12px;font-weight:600;letter-spacing:0.1em;color:#64748b;text-transform:uppercase;">Loading HELLO ENGLISH...</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
